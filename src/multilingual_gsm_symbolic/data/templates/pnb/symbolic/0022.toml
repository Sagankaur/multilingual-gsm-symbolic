question = "فاطمہ اپنے گھر اک رات دی دعوت دی تیاری کر رہی سی، جتھے اوہ مہماناں نوں سالن کھواؤنا چاہندی سی۔ اوہنے ویکھیا پئی اوہدے کول پلاسٹک دے چمچ مُک گئے نیں، ایس لئی اوہنے چمچ دا اک نواں پیکٹ خریدیا۔ بعد وچ اوہدے خاوند نے وی 5 نویں چمچ دا اک پیکٹ خریدیا تے فاطمہ نوں دے دتا۔ جدوں فاطمہ سالن بنا رہی سی، اوہنے سالن چکھن لئی ترے چمچ ورت لئے۔ بعد وچ جدوں اوہ میز لاؤن گئی، تاں اوہدے کول کُل 12 چمچ سن۔ فاطمہ نے جیہڑا پیکٹ خریدیا سی اوہدے وچ کنے چمچ سن؟"
